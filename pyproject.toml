[project]
name = "gpuma"
version = "0.8.1"
description = "GPUMA - Geometry optimization toolkit using Fairchem UMA, ORB-v3 and SevenNet models with Torch-Sim"
readme = "README.md"
requires-python = "==3.12.*"
license = "MIT"
authors = [
  { name = "Niklas Hölter", email = "niklas.hoelter@uni-muenster.de" },
]
keywords = ["chemistry", "geometry-optimization", "uma", "fairchem", "ase", "mlip", "gpuma"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
  "ase==3.27.0",
  "torch==2.13.0",
  "torch-sim-atomistic==0.6.2",
  "fairchem-core==2.24.0",
  "morfeus-ml==0.8.0",
  "rdkit==2026.3.1",
  "tables==3.11.1",
  "scipy==1.17.1",
  "hf_xet==1.2.0",
  "pyyaml==6.0.3",
  "orb-models==0.6.1",
  "nvalchemi-toolkit-ops==0.5.0",
  "warp-lang==1.17.0",
  "sevenn[torchsim]==0.13.0",
  "nvmolkit==0.5.1"
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "build==1.6.1",
    "twine==6.2.0",
    "pip-tools==7.6.2",
    "ruff==0.17.2",
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "mkdocstrings[python]==1.0.8",
    "mkdocstrings-python==2.0.10",
    "mkdocs-llmstxt==0.5.1"
]

[project.urls]
Source = "https://github.com/NiklasHoelter/gpuma"
Documentation = "https://niklashoelter.github.io/gpuma/"

[project.scripts]
gpuma = "gpuma.cli:main"

[build-system]
requires = ["setuptools==80.10.2", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["gpuma*"]

[tool.setuptools.package-data]
gpuma = ["skills/gpuma/*.md", "skills/gpuma/references/*.md"]

[tool.uv]
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E203", "D100", "D101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
