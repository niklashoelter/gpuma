# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
    - name: Install dependencies and package
      run: |
        python -m pip install pip==26.2.2 setuptools==80.10.2 wheel==0.48.0
        pip install flake8==7.4.1 pytest==9.1.1

        # install this package (pulls dependencies from pyproject.toml)
        pip install -e .

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest -q
    - name: Build package
      run: |
        pip install build==1.6.1 twine==6.2.0
        python -m build
    - name: Check package description
      run: |
        twine check dist/*
